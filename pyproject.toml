[project]
name = "lsatfetch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Gabriel Belouze", email = "gabriel@belouze.com" }]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.30",
    "cyclopts>=4.5.0",
    "duckdb>=1.1.0",
    "geopandas>=1.1.2",
    "numpy>=2.4.1",
    "omegaconf>=2.3.0",
    "pooch>=1.8.2",
    "pyarrow>=18.0.0",
    "pytest>=9.0.2",
    "rasterio>=1.5.0",
    "rich>=14.2.0",
    "s3fs>=2026.1.0",
    "thefuzz>=0.22.1",
]

[project.scripts]
lsatfetch = "lsatfetch.cli.main:app"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle and pydoclint
    # "D",
    "DOC",
    # flake8-use-pathlib
    "PTH",
    # flake8-logging
    "LOG",
    # flake8-no-pep420
    "INP",
    "PIE",
    "T20",
    # pytest
    "PT",
]
ignore = ["DOC501", "DOC201"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = ["INP001"]
"docs/**/*.py" = ["INP001"]

[tool.pydoclint]
style = "numpy"
skip-checking-raises = true
check-style-mismatch = true
ignore = [
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC403",
    "DOC501",
    "DOC501",
] # ignore what ruff implements

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow"]
log_cli = true
log_cli_level = "DEBUG"
log_level = "DEBUG"

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = false
ignore_missing_imports = true
exclude = ['tests/test_download.py', 'tests/conftest.py']

[tool.pyright]
typeCheckingMode = "off"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "catppuccin>=2.5.0",
    "moto>=5.1.20",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "types-decorator>=5.2.0.20251101",
    "types-python-dateutil>=2.9.0.20251115",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]
