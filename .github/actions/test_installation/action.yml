name: test install
description: re-usable steps for installing and testing

runs:
  using: "composite"
  steps:
    - name: Clone repo
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Install package
      shell: bash
      run: uv sync
    - name: Run lsatfetch help
      shell: bash
      run: uv run lsatfetch --help

